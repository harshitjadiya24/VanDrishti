# One-server production stack: Caddy (HTTPS + console) → API → Postgres/PostGIS.
#   cp deploy/.env.prod.example deploy/.env.prod   # fill in secrets, chmod 600
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build --wait
# Only Caddy publishes ports. The database and API stay on the private network. Model
# stages (detection, species, re-ID) run as batch jobs on a machine with the `ml` group,
# not in these containers (docs/RUNBOOK.md).
name: vandrishti-prod

x-api-env: &api-env
  VANDRISHTI_ENV: prod
  VANDRISHTI_DB_HOST: db
  VANDRISHTI_DB_USER: ${VANDRISHTI_DB_USER:-vandrishti}
  VANDRISHTI_DB_PASSWORD: ${VANDRISHTI_DB_PASSWORD:?set VANDRISHTI_DB_PASSWORD in deploy/.env.prod}
  VANDRISHTI_DB_NAME: ${VANDRISHTI_DB_NAME:-vandrishti}
  VANDRISHTI_STORAGE_ROOT: /data/store
  VANDRISHTI_LOG_JSON: "true"
  VANDRISHTI_INGEST_TOKEN: ${VANDRISHTI_INGEST_TOKEN:-}
  VANDRISHTI_ALERT_WEBHOOK_URL: ${VANDRISHTI_ALERT_WEBHOOK_URL:-}
  VANDRISHTI_ALERT_WEBHOOK_SECRET: ${VANDRISHTI_ALERT_WEBHOOK_SECRET:-}

services:
  db:
    build: ../docker/db
    image: vandrishti/postgres:16-postgis
    environment:
      POSTGRES_USER: ${VANDRISHTI_DB_USER:-vandrishti}
      POSTGRES_PASSWORD: ${VANDRISHTI_DB_PASSWORD:?set VANDRISHTI_DB_PASSWORD}
      POSTGRES_DB: ${VANDRISHTI_DB_NAME:-vandrishti}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backups:/backups
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build: ../backend
    image: vandrishti/api:${VANDRISHTI_VERSION:-0.2.0}
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    restart: "no"

  api:
    image: vandrishti/api:${VANDRISHTI_VERSION:-0.2.0}
    environment:
      <<: *api-env
      VANDRISHTI_API_HOST: 0.0.0.0
      VANDRISHTI_FORWARDED_ALLOW_IPS: "*"  # only Caddy can reach it on this network
    volumes:
      # A host directory (owned by uid 10001) so scripts/backup.py can copy it.
      - ${VANDRISHTI_STORE_DIR:-../store}:/data/store
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 768m
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: vandrishti/web:${VANDRISHTI_VERSION:-0.2.0}
    environment:
      VANDRISHTI_DOMAIN: ${VANDRISHTI_DOMAIN:-localhost}
    ports:
      - "${VANDRISHTI_HTTP_PORT:-80}:80"
      - "${VANDRISHTI_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
