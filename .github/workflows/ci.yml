name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_SYNC: "1"   # keep `uv run` from adding the ml group back

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-group ml   # no PyTorch in CI; real-model tests are `slow`
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Start Postgres (PostGIS) and Redis
        working-directory: .
        run: cp .env.example .env && docker compose up -d --build --wait
      - run: uv sync --locked --no-group ml   # no PyTorch in CI; real-model tests are `slow`
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # includes tsc -b (strict type check)

  images:
    # The production images build, and the production compose file is valid.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: VANDRISHTI_DB_PASSWORD=ci docker compose -f deploy/compose.prod.yml config --quiet
      - run: docker build -t vandrishti/api:ci backend
      - run: docker build -t vandrishti/web:ci -f frontend/Dockerfile .
      - name: API image starts only with safe production settings
        run: |
          docker run --rm vandrishti/api:ci python -c "import vandrishti.api.app" 2>&1 \
            | grep -q "refusing to start in prod"
