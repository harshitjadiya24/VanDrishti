[project]
name = "vandrishti"
version = "0.2.0"
description = "Camera-trap monitoring for Indian tiger reserves: AI proposes, people decide"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "pillow>=11.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[project.scripts]
vandrishti = "vandrishti.cli:main"
vandrishti-api = "vandrishti.api.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "N", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not integration'"
markers = [
    "integration: needs the compose Postgres",
    "slow: loads real model weights",
]

[[tool.mypy.overrides]]
# Torch arrives with the ML group in a later phase; adapters import it optionally.
module = ["torch", "torch.*"]
ignore_missing_imports = true
